<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Johnny's Cash</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:#000;
      color:#e6edf3;
      font-family:'Segoe UI', system-ui, sans-serif;
      min-height:100vh;
      overflow:hidden;
    }

    /* ── Video Background ── */
    #yt-container {
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      z-index:0; overflow:hidden;
      pointer-events:none;
    }
    #yt-player {
      position:absolute;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:100vw; height:56.25vw;
      min-height:100vh; min-width:177.78vh;
    }
    .overlay {
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      background:rgba(0,0,0,0.55);
      z-index:1;
    }

    /* ── App Shell ── */
    #app {
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      z-index:10;
      display:flex; flex-direction:column;
    }

    /* ── Top Bar ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 24px 0;
      flex-shrink:0;
    }
    .hamburger {
      background:none; border:none;
      cursor:pointer; padding:8px;
      display:flex; flex-direction:column; gap:5px;
      z-index:100;
    }
    .hamburger span {
      display:block; width:24px; height:2px;
      background:#fff; border-radius:2px;
      transition:all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

    .topbar-right {
      font-size:0.72rem; color:rgba(255,255,255,0.4);
      letter-spacing:0.5px;
    }

    /* ── Home Screen ── */
    #home-screen {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:20px;
      transition:opacity 0.4s ease;
    }
    .home-title {
      font-size:2.8rem; font-weight:700; color:#fff;
      text-shadow:0 2px 20px rgba(0,0,0,0.8);
      letter-spacing:-1px; margin-bottom:10px;
    }
    .home-subtitle {
      font-size:0.9rem; color:rgba(255,255,255,0.5);
      letter-spacing:1px; text-transform:uppercase;
    }
    .home-hint {
      position:absolute; bottom:36px;
      font-size:0.75rem; color:rgba(255,255,255,0.35);
      letter-spacing:0.5px;
      animation:fadeup 2s ease-in-out infinite alternate;
    }
    @keyframes fadeup { from{opacity:0.2; transform:translateY(4px)} to{opacity:0.6; transform:translateY(0)} }

    /* ── Drawer Menu ── */
    #drawer {
      position:fixed; top:0; left:0;
      width:300px; height:100%;
      background:rgba(13,17,23,0.97);
      border-right:1px solid #30363d;
      z-index:50;
      transform:translateX(-100%);
      transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
      overflow-y:auto;
      padding-top:80px;
    }
    #drawer.open { transform:translateX(0); }

    .drawer-section-label {
      font-size:0.65rem; font-weight:600;
      text-transform:uppercase; letter-spacing:1px;
      color:#6e7681; padding:16px 24px 8px;
    }

    .drawer-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 24px;
      cursor:pointer;
      transition:background 0.15s;
      border-bottom:1px solid #21262d;
    }
    .drawer-item:hover { background:rgba(255,255,255,0.05); }
    .drawer-item-left { display:flex; align-items:center; gap:12px; }
    .drawer-ticker { font-size:1rem; font-weight:700; color:#fff; }
    .drawer-name { font-size:0.75rem; color:#6e7681; margin-top:1px; }
    .drawer-price {
      font-size:0.88rem; font-weight:600; color:#fff;
      text-align:right;
    }
    .drawer-change { font-size:0.72rem; margin-top:2px; text-align:right; }
    .drawer-change.up   { color:#3fb950; }
    .drawer-change.down { color:#f85149; }
    .drawer-change.flat { color:#6e7681; }
    .drawer-dot {
      width:8px; height:8px; border-radius:50%; flex-shrink:0;
    }
    .dot-biotech { background:#ffa657; }
    .dot-semi    { background:#d2a8ff; }
    .dot-tech    { background:#3fb950; }
    .dot-etf     { background:#58a6ff; }
    .dot-option  { background:#e8b4ff; }

    /* ── Stock Detail View ── */
    #detail-screen {
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      z-index:20;
      background:rgba(13,17,23,0.96);
      transform:translateX(100%);
      transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
      overflow-y:auto;
      padding:24px 24px 60px;
    }
    #detail-screen.open { transform:translateX(0); }

    .detail-back {
      display:flex; align-items:center; gap:8px;
      background:none; border:none; cursor:pointer;
      color:#58a6ff; font-size:0.88rem; font-weight:600;
      margin-bottom:28px; padding:4px 0;
    }
    .detail-back:hover { color:#388bfd; }

    .detail-header { margin-bottom:24px; }
    .detail-ticker { font-size:2.2rem; font-weight:700; color:#fff; letter-spacing:-1px; }
    .detail-name   { font-size:0.88rem; color:#8b949e; margin-top:4px; }

    .detail-price-block { margin-bottom:28px; }
    .detail-price {
      font-size:3rem; font-weight:700; color:#fff;
      letter-spacing:-1.5px; line-height:1;
      margin-bottom:8px;
    }
    .detail-day-change {
      display:inline-flex; align-items:center; gap:8px;
      font-size:1rem; font-weight:600;
      padding:5px 12px; border-radius:8px;
    }
    .detail-day-change.up   { color:#3fb950; background:#1a3a2a; }
    .detail-day-change.down { color:#f85149; background:#3a1a1a; }
    .detail-day-change.flat { color:#8b949e; background:#1c2128; }
    .detail-day-label { font-size:0.72rem; color:#6e7681; margin-top:6px; text-transform:uppercase; letter-spacing:0.5px; }

    /* Stats grid */
    .stats-grid {
      display:grid; grid-template-columns:1fr 1fr;
      gap:1px; background:#21262d;
      border-radius:12px; overflow:hidden;
      margin-bottom:28px;
    }
    .stat-cell {
      background:#161b22; padding:16px 18px;
    }
    .stat-label { font-size:0.68rem; color:#6e7681; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
    .stat-value { font-size:1.05rem; font-weight:600; color:#e6edf3; }
    .stat-value.up   { color:#3fb950; }
    .stat-value.down { color:#f85149; }

    /* News card */
    .news-card {
      background:#161b22; border:1px solid #30363d;
      border-radius:12px; padding:20px;
    }
    .news-card-label {
      font-size:0.68rem; font-weight:600; text-transform:uppercase;
      letter-spacing:1px; color:#6e7681; margin-bottom:12px;
    }
    .news-card-headline {
      font-size:1rem; color:#e6edf3; line-height:1.55;
      font-weight:500; margin-bottom:12px;
    }
    .news-card-meta {
      display:flex; justify-content:space-between; align-items:center;
    }
    .news-card-source { font-size:0.75rem; color:#6e7681; }
    .news-card-link {
      font-size:0.78rem; color:#58a6ff;
      text-decoration:none; font-weight:600;
    }
    .news-card-link:hover { text-decoration:underline; }
    .news-empty-msg { font-size:0.85rem; color:#6e7681; }

    /* Loading */
    .loading-pulse { background:#21262d; border-radius:4px; animation:pulse 1.5s ease-in-out infinite; height:1em; width:80px; display:inline-block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Drawer backdrop */
    #backdrop {
      display:none; position:fixed; top:0; left:0;
      width:100%; height:100%;
      z-index:40;
    }
    #backdrop.open { display:block; }
  </style>
</head>
<body>

<!-- YouTube Background -->
<div id="yt-container">
  <div id="yt-player"></div>
</div>
<div class="overlay"></div>

<!-- Backdrop (closes drawer on outside click) -->
<div id="backdrop" onclick="closeDrawer()"></div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <button class="hamburger" id="hamburger" onclick="toggleDrawer()">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-right" id="last-updated"></div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen">
    <div class="home-title">My Portfolio</div>
    <div class="home-subtitle">Live Market Tracker</div>
    <div class="home-hint">☰ Open menu to view positions</div>
  </div>
</div>

<!-- Drawer -->
<div id="drawer">
  <div class="drawer-section-label">My Positions</div>
  <div id="drawer-positions"></div>
  <div class="drawer-section-label">LEAP Options</div>
  <div id="drawer-options"></div>
  <div class="drawer-section-label">Watchlist</div>
  <div id="drawer-watchlist"></div>
</div>

<!-- Stock Detail -->
<div id="detail-screen">
  <button class="detail-back" onclick="closeDetail()">← Back</button>
  <div id="detail-content"></div>
</div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const API_KEY = 'd8ccu6pr01qidic7dqlgd8ccu6pr01qidic7dqm0';

  const POSITIONS = [
    { ticker:'NBIS',  name:'Neurobiological Sciences', dot:'dot-biotech', shares:17.813124, avgCost:112.44 },
    { ticker:'AMD',   name:'Advanced Micro Devices',   dot:'dot-semi',    shares:7.613888,  avgCost:197.52 },
    { ticker:'MSFT',  name:'Microsoft Corp.',           dot:'dot-tech',    shares:4.581909,  avgCost:534.59 },
  ];

  const OPTIONS = [
    { ticker:'SPY-CALL', name:'SPY $645 Call · Jan 2027', dot:'dot-option', isOption:true, underlying:'SPY', strike:645, contracts:1, avgCost:82.00, breakeven:727.00, expiry:'1/15/2027' },
    { ticker:'QQQ-CALL', name:'QQQ $675 Call · Jun 2027', dot:'dot-option', isOption:true, underlying:'QQQ', strike:675, contracts:1, avgCost:91.50, breakeven:766.50, expiry:'6/17/2027' },
  ];

  const WATCHLIST = [
    { ticker:'SPY',   name:'SPDR S&P 500 ETF',      dot:'dot-etf'  },
    { ticker:'QQQ',   name:'Invesco Nasdaq-100 ETF', dot:'dot-etf'  },
    { ticker:'AAPL',  name:'Apple Inc.',              dot:'dot-tech' },
    { ticker:'GOOGL', name:'Alphabet Inc.',           dot:'dot-tech' },
  ];

  const fmt  = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtD = n => (n >= 0 ? '+$' : '-$') + fmt(Math.abs(n));
  const fmtP = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  const dir  = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';

  // Data stores
  const quoteCache = {};
  const newsCache  = {};

  // ── YouTube Player ────────────────────────────────────────
  let ytPlayer, ytReady = false;
  const START_SEC = 940; // 15:40
  const END_SEC   = 1000; // 16:40

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      videoId: 's8ctjBfWHBk',
      playerVars: {
        autoplay:1, mute:1, controls:0,
        start: START_SEC, modestbranding:1,
        rel:0, showinfo:0, playsinline:1, loop:0,
        iv_load_policy:3, disablekb:1,
      },
      events: {
        onReady: e => { ytReady=true; e.target.playVideo(); },
        onStateChange: e => {
          if (e.data === YT.PlayerState.PLAYING) startTimeWatcher();
        }
      }
    });
  }

  let watcherInterval = null;
  function startTimeWatcher() {
    if (watcherInterval) return;
    watcherInterval = setInterval(() => {
      if (!ytReady || !ytPlayer) return;
      const t = ytPlayer.getCurrentTime();
      if (t >= END_SEC || t < START_SEC - 2) {
        ytPlayer.seekTo(START_SEC, true);
      }
    }, 1000);
  }

  // ── Drawer ────────────────────────────────────────────────
  function toggleDrawer() {
    const drawer    = document.getElementById('drawer');
    const backdrop  = document.getElementById('backdrop');
    const hamburger = document.getElementById('hamburger');
    const isOpen    = drawer.classList.contains('open');
    if (isOpen) { closeDrawer(); }
    else {
      drawer.classList.add('open');
      backdrop.classList.add('open');
      hamburger.classList.add('open');
    }
  }
  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('backdrop').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  }

  // ── Detail View ───────────────────────────────────────────
  function openDetail(ticker) {
    closeDrawer();
    const screen = document.getElementById('detail-screen');
    const content = document.getElementById('detail-content');
    content.innerHTML = '<div style="text-align:center;padding:60px 0"><span class="loading-pulse" style="width:120px;height:20px"></span></div>';
    screen.classList.add('open');
    renderDetail(ticker);
  }
  function closeDetail() {
    document.getElementById('detail-screen').classList.remove('open');
  }

  function renderDetail(ticker) {
    // Find the item
    const pos  = POSITIONS.find(p => p.ticker === ticker);
    const opt  = OPTIONS.find(o => o.ticker === ticker);
    const watch= WATCHLIST.find(w => w.ticker === ticker);
    const item = pos || opt || watch;
    if (!item) return;

    const content = document.getElementById('detail-content');
    const q = quoteCache[opt ? opt.underlying : ticker];
    const news = newsCache[opt ? opt.underlying : ticker];

    // Price & change
    const price    = q ? q.c  : null;
    const change   = q ? q.d  : null;  // $ change
    const changePct= q ? q.dp : null;  // % change
    const prevClose= q ? q.pc : null;

    // P&L calcs
    let dayPnl=null, totalPnl=null, totalRet=null, mktValue=null;
    if (pos && price != null) {
      dayPnl   = change * pos.shares;
      mktValue = price * pos.shares;
      totalPnl = mktValue - (pos.avgCost * pos.shares);
      totalRet = (totalPnl / (pos.avgCost * pos.shares)) * 100;
    }

    const priceStr    = price   != null ? '$' + fmt(price)    : '—';
    const changeStr   = change  != null ? (change>=0?'+$':'-$')+fmt(Math.abs(change)) : '—';
    const changePctStr= changePct!=null ? fmtP(changePct)      : '—';
    const d           = changePct != null ? dir(changePct) : 'flat';

    // Build stats
    let statsHTML = '';
    if (pos && price != null) {
      statsHTML = `
        <div class="stat-cell">
          <div class="stat-label">Today's Return</div>
          <div class="stat-value ${dir(dayPnl)}">${fmtD(dayPnl)} (${fmtP(changePct)})</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Total Gain / Loss</div>
          <div class="stat-value ${dir(totalPnl)}">${fmtD(totalPnl)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Market Value</div>
          <div class="stat-value">$${fmt(mktValue)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Total Return</div>
          <div class="stat-value ${dir(totalRet)}">${fmtP(totalRet)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Shares</div>
          <div class="stat-value">${pos.shares.toFixed(4)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Avg Cost</div>
          <div class="stat-value">$${fmt(pos.avgCost)}</div>
        </div>`;
    } else if (opt && price != null) {
      statsHTML = `
        <div class="stat-cell">
          <div class="stat-label">Underlying Price</div>
          <div class="stat-value">$${fmt(price)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Strike</div>
          <div class="stat-value">$${fmt(opt.strike)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Breakeven</div>
          <div class="stat-value">$${fmt(opt.breakeven)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Distance to Strike</div>
          <div class="stat-value ${price > opt.strike ? 'up':'down'}">${price > opt.strike ? '+':''}$${fmt(price - opt.strike)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Avg Cost Paid</div>
          <div class="stat-value">$${fmt(opt.avgCost)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Expiration</div>
          <div class="stat-value">${opt.expiry}</div>
        </div>`;
    } else if (watch && price != null) {
      statsHTML = `
        <div class="stat-cell">
          <div class="stat-label">Day Change</div>
          <div class="stat-value ${d}">${changeStr} (${changePctStr})</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Prev Close</div>
          <div class="stat-value">$${fmt(prevClose)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Day High</div>
          <div class="stat-value">$${fmt(q.h)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Day Low</div>
          <div class="stat-value">$${fmt(q.l)}</div>
        </div>`;
    }

    // News
    let newsHTML = '';
    if (news) {
      newsHTML = `
        <div class="news-card-headline">${news.headline}</div>
        <div class="news-card-meta">
          <span class="news-card-source">${news.source} · ${new Date(news.datetime*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
          <a class="news-card-link" href="${news.url}" target="_blank" rel="noopener">Read article →</a>
        </div>`;
    } else {
      newsHTML = '<div class="news-empty-msg">No recent news found.</div>';
    }

    content.innerHTML = `
      <div class="detail-header">
        <div class="detail-ticker">${item.name?.includes('Call') ? item.name.split('·')[0].trim() : ticker}</div>
        <div class="detail-name">${item.name}</div>
      </div>

      <div class="detail-price-block">
        <div class="detail-price">${priceStr}</div>
        <div class="detail-day-change ${d}">${changeStr} &nbsp; ${changePctStr}</div>
        <div class="detail-day-label">Today</div>
      </div>

      <div class="stats-grid">${statsHTML}</div>

      <div class="news-card">
        <div class="news-card-label">Latest News</div>
        ${newsHTML}
      </div>`;
  }

  // ── Build Drawer Items ────────────────────────────────────
  function buildDrawer() {
    document.getElementById('drawer-positions').innerHTML = POSITIONS.map(p => `
      <div class="drawer-item" onclick="openDetail('${p.ticker}')">
        <div class="drawer-item-left">
          <div class="drawer-dot ${p.dot}"></div>
          <div>
            <div class="drawer-ticker">${p.ticker}</div>
            <div class="drawer-name">${p.name}</div>
          </div>
        </div>
        <div>
          <div class="drawer-price" id="dpr-${p.ticker}">—</div>
          <div class="drawer-change flat" id="dch-${p.ticker}">—</div>
        </div>
      </div>`).join('');

    document.getElementById('drawer-options').innerHTML = OPTIONS.map(o => `
      <div class="drawer-item" onclick="openDetail('${o.ticker}')">
        <div class="drawer-item-left">
          <div class="drawer-dot ${o.dot}"></div>
          <div>
            <div class="drawer-ticker">${o.underlying}</div>
            <div class="drawer-name">${o.name}</div>
          </div>
        </div>
        <div>
          <div class="drawer-price" id="dpr-${o.ticker}">—</div>
          <div class="drawer-change flat" id="dch-${o.ticker}">—</div>
        </div>
      </div>`).join('');

    document.getElementById('drawer-watchlist').innerHTML = WATCHLIST.map(w => `
      <div class="drawer-item" onclick="openDetail('${w.ticker}')">
        <div class="drawer-item-left">
          <div class="drawer-dot ${w.dot}"></div>
          <div>
            <div class="drawer-ticker">${w.ticker}</div>
            <div class="drawer-name">${w.name}</div>
          </div>
        </div>
        <div>
          <div class="drawer-price" id="dpr-${w.ticker}">—</div>
          <div class="drawer-change flat" id="dch-${w.ticker}">—</div>
        </div>
      </div>`).join('');
  }

  // ── Update drawer prices ──────────────────────────────────
  function updateDrawerPrice(id, price, dp) {
    const prEl = document.getElementById(`dpr-${id}`);
    const chEl = document.getElementById(`dch-${id}`);
    if (prEl) prEl.textContent = '$' + fmt(price);
    if (chEl) {
      chEl.textContent = (dp>=0?'+':'')+dp.toFixed(2)+'%';
      chEl.className = `drawer-change ${dir(dp)}`;
    }
  }

  // ── Fetch ─────────────────────────────────────────────────
  async function fetchQuote(ticker) {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${API_KEY}`);
    return r.json();
  }
  async function fetchNews(ticker) {
    const to=new Date(), from=new Date(); from.setDate(from.getDate()-7);
    const fd=d=>d.toISOString().split('T')[0];
    const r = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${ticker}&from=${fd(from)}&to=${fd(to)}&token=${API_KEY}`);
    return r.json();
  }

  // ── Main init ─────────────────────────────────────────────
  async function init() {
    const allTickers = [...new Set([
      ...POSITIONS.map(p=>p.ticker),
      ...OPTIONS.map(o=>o.underlying),
      ...WATCHLIST.map(w=>w.ticker),
    ])];

    // Fetch all quotes
    await Promise.all(allTickers.map(async t => {
      try { quoteCache[t] = await fetchQuote(t); } catch(e){}
    }));

    // Update drawer prices
    POSITIONS.forEach(p => {
      const q = quoteCache[p.ticker];
      if (q) updateDrawerPrice(p.ticker, q.c, q.dp);
    });
    OPTIONS.forEach(o => {
      const q = quoteCache[o.underlying];
      if (q) updateDrawerPrice(o.ticker, q.c, q.dp);
    });
    WATCHLIST.forEach(w => {
      const q = quoteCache[w.ticker];
      if (q) updateDrawerPrice(w.ticker, q.c, q.dp);
    });

    // Fetch news for all tickers
    const newsTickers = [...new Set([
      ...POSITIONS.map(p=>p.ticker),
      ...OPTIONS.map(o=>o.underlying),
      ...WATCHLIST.map(w=>w.ticker),
    ])];
    await Promise.all(newsTickers.map(async t => {
      try {
        const items = await fetchNews(t);
        const top = (items||[]).find(n => n.headline && n.url);
        if (top) newsCache[t] = top;
      } catch(e){}
    }));

    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  }

  // ── Boot ──────────────────────────────────────────────────
  buildDrawer();
  init();
</script>
</body>
</html>
