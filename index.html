<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Portfolio Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; }
    #last-updated { color: #58a6ff; font-size: 0.78rem; margin-top: 5px; }

    /* Summary Bar */
    .summary-bar {
      display: flex; justify-content: center; gap: 32px; flex-wrap: wrap;
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 18px 32px; max-width: 900px; margin: 0 auto 36px;
    }
    .summary-item { text-align: center; }
    .summary-label { font-size: 0.7rem; color: #6e7681; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-value { font-size: 1.3rem; font-weight: 700; color: #fff; margin-top: 3px; }
    .summary-value.up   { color: #3fb950; }
    .summary-value.down { color: #f85149; }

    /* Section title */
    .section-title {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: #6e7681;
      max-width: 1100px; margin: 0 auto 14px; padding-left: 4px;
    }

    /* Cards grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px; max-width: 1100px; margin: 0 auto 36px;
    }

    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 20px 22px; transition: border-color 0.2s, transform 0.15s;
    }
    .card:hover { border-color: #58a6ff44; transform: translateY(-2px); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .ticker { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .company-name { color: #8b949e; font-size: 0.8rem; margin-bottom: 14px; }
    .badge { font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-etf     { background: #1f3a5f; color: #58a6ff; }
    .badge-tech    { background: #1a3a2a; color: #3fb950; }
    .badge-semi    { background: #3a1f4a; color: #d2a8ff; }
    .badge-biotech { background: #3a2a1a; color: #ffa657; }
    .badge-option  { background: #2a1f3a; color: #e8b4ff; }

    .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .price { font-size: 1.75rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .change { font-size: 0.88rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
    .change.up   { color: #3fb950; background: #1a3a2a; }
    .change.down { color: #f85149; background: #3a1a1a; }
    .change.flat { color: #8b949e; background: #1c2128; }

    .meta { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding-top: 14px; border-top: 1px solid #21262d; }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-size: 0.65rem; color: #6e7681; text-transform: uppercase; letter-spacing: 0.5px; }
    .meta-value { font-size: 0.82rem; color: #c9d1d9; font-weight: 500; }
    .meta-value.up   { color: #3fb950; }
    .meta-value.down { color: #f85149; }

    /* ── Robinhood-style Options Card ── */
    .opt-card {
      background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 22px 24px; transition: border-color 0.2s;
    }
    .opt-card:hover { border-color: #a371f744; }
    .opt-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .opt-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .opt-subtitle { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }

    .opt-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }

    .opt-left { border-right: 1px solid #21262d; padding-right: 20px; }
    .opt-right { padding-left: 20px; }

    .opt-mkt-label { font-size: 0.72rem; color: #6e7681; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .opt-mkt-value { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 16px; }

    .opt-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; border-bottom: 1px solid #21262d; font-size: 0.83rem;
    }
    .opt-row:last-child { border-bottom: none; }
    .opt-row-label { color: #8b949e; }
    .opt-row-value { color: #e6edf3; font-weight: 500; text-align: right; }
    .opt-row-value.up   { color: #3fb950; }
    .opt-row-value.down { color: #f85149; }

    /* News */
    .news-list { max-width: 1100px; margin: 0 auto 36px; display: flex; flex-direction: column; gap: 10px; }
    .news-item {
      background: #161b22; border: 1px solid #30363d; border-radius: 10px;
      padding: 14px 18px; display: flex; gap: 14px; align-items: flex-start;
      text-decoration: none; color: inherit; transition: border-color 0.2s;
    }
    .news-item:hover { border-color: #58a6ff44; }
    .news-ticker-tag { font-size: 0.65rem; font-weight: 700; background: #1f3a5f; color: #58a6ff; padding: 2px 7px; border-radius: 4px; white-space: nowrap; margin-top: 2px; text-transform: uppercase; }
    .news-body { flex: 1; }
    .news-headline { font-size: 0.88rem; color: #e6edf3; line-height: 1.4; margin-bottom: 4px; }
    .news-source { font-size: 0.72rem; color: #6e7681; }

    /* Refresh */
    .refresh-btn {
      display: block; margin: 10px auto 0;
      background: #1f6feb; color: #fff; border: none;
      padding: 10px 28px; border-radius: 8px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .refresh-btn:hover { background: #388bfd; }
    .refresh-btn:disabled { background: #1c2128; color: #6e7681; cursor: not-allowed; }

    .loading-pulse { background: #21262d; border-radius: 4px; animation: pulse 1.5s ease-in-out infinite; height: 1em; width: 80px; display: inline-block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    footer { text-align: center; color: #6e7681; font-size: 0.72rem; margin-top: 50px; }
  </style>
</head>
<body>

<header>
  <h1>My Portfolio Dashboard</h1>
  <div id="last-updated">Loading...</div>
</header>

<!-- Summary Bar -->
<div class="summary-bar">
  <div class="summary-item">
    <div class="summary-label">Stocks Value</div>
    <div class="summary-value" id="sum-stock-value">—</div>
  </div>
  <div class="summary-item">
    <div class="summary-label">Stock Gain / Loss</div>
    <div class="summary-value" id="sum-stock-pnl">—</div>
  </div>
  <div class="summary-item">
    <div class="summary-label">Options Value</div>
    <div class="summary-value" id="sum-opt-value">—</div>
  </div>
  <div class="summary-item">
    <div class="summary-label">Options Gain / Loss</div>
    <div class="summary-value" id="sum-opt-pnl">—</div>
  </div>
</div>

<!-- Portfolio Positions -->
<div class="section-title">My Positions</div>
<div class="grid" id="portfolio-grid"></div>

<!-- LEAP Options -->
<div class="section-title">LEAP Options</div>
<div class="grid" id="options-grid"></div>

<!-- Watchlist -->
<div class="section-title">Watchlist</div>
<div class="grid" id="watch-grid"></div>

<!-- News -->
<div class="section-title">Top News — My Tickers</div>
<div class="news-list" id="news-list">
  <div style="color:#6e7681;font-size:.85rem;text-align:center;padding:20px">Loading news...</div>
</div>

<button class="refresh-btn" id="refresh-btn" onclick="init()">Refresh All</button>
<footer>Data via Finnhub · For personal use only · Not financial advice</footer>

<script>
  const API_KEY = 'd8ccu6pr01qidic7dqlgd8ccu6pr01qidic7dqm0';

  const POSITIONS = [
    { ticker:'NBIS',  name:'Neurobiological Sciences', badge:'Biotech', badgeClass:'badge-biotech', shares:17.813124, avgCost:112.44 },
    { ticker:'AMD',   name:'Advanced Micro Devices',   badge:'Semi',    badgeClass:'badge-semi',    shares:7.613888,  avgCost:197.52 },
    { ticker:'MSFT',  name:'Microsoft Corp.',           badge:'Tech',    badgeClass:'badge-tech',    shares:4.581909,  avgCost:534.59 },
  ];

  const OPTIONS = [
    { label:'SPY $645 Call',  underlying:'SPY', strike:645, expiry:'1/15/2027', expiryISO:'2027-01-15', contracts:1, avgCost:82.00,  breakeven:727.00  },
    { label:'QQQ $675 Call',  underlying:'QQQ', strike:675, expiry:'6/17/2027', expiryISO:'2027-06-17', contracts:1, avgCost:91.50,  breakeven:766.50  },
  ];

  const WATCHLIST = [
    { ticker:'SPY',   name:'SPDR S&P 500 ETF',      badge:'ETF',  badgeClass:'badge-etf'  },
    { ticker:'QQQ',   name:'Invesco Nasdaq-100 ETF', badge:'ETF',  badgeClass:'badge-etf'  },
    { ticker:'AAPL',  name:'Apple Inc.',              badge:'Tech', badgeClass:'badge-tech' },
    { ticker:'GOOGL', name:'Alphabet Inc.',           badge:'Tech', badgeClass:'badge-tech' },
  ];

  const NEWS_TICKERS = ['NBIS','AMD','MSFT','SPY','QQQ'];

  const fmt  = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fmtD = n => (n >= 0 ? '+$' : '-$') + fmt(Math.abs(n));
  const fmtP = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';

  async function fetchQuote(ticker) {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${API_KEY}`);
    return r.json();
  }

  async function fetchOptionPrice(symbol, expiry, strike, type='call') {
    try {
      const r = await fetch(`https://finnhub.io/api/v1/stock/option-chain?symbol=${symbol}&expiration=${expiry}&token=${API_KEY}`);
      const data = await r.json();
      if (!data.data) return null;
      for (const exp of data.data) {
        const calls = (exp.options || {})[type.toUpperCase()] || [];
        const match = calls.find(c => Math.abs(c.strike - strike) < 0.01);
        if (match) return { last: match.lastPrice, change: match.change, pctChange: match.percentChange, prevClose: match.lastPrice - match.change };
      }
    } catch(e) {}
    return null;
  }

  async function fetchNews(ticker) {
    const to   = new Date();
    const from = new Date(); from.setDate(from.getDate() - 7);
    const fmtD = d => d.toISOString().split('T')[0];
    const r = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${ticker}&from=${fmtD(from)}&to=${fmtD(to)}&token=${API_KEY}`);
    return r.json();
  }

  // ── Build cards ───────────────────────────────────────────
  function buildPortfolioCards() {
    document.getElementById('portfolio-grid').innerHTML = POSITIONS.map(p => `
      <div class="card">
        <div class="card-header">
          <div class="ticker">${p.ticker}</div>
          <span class="badge ${p.badgeClass}">${p.badge}</span>
        </div>
        <div class="company-name">${p.name}</div>
        <div class="price-row">
          <div class="price" id="price-${p.ticker}"><span class="loading-pulse"></span></div>
          <div class="change flat" id="change-${p.ticker}">—</div>
        </div>
        <div class="meta">
          <div class="meta-item"><span class="meta-label">Shares</span><span class="meta-value">${p.shares.toFixed(4)}</span></div>
          <div class="meta-item"><span class="meta-label">Avg Cost</span><span class="meta-value">$${fmt(p.avgCost)}</span></div>
          <div class="meta-item"><span class="meta-label">Invested</span><span class="meta-value">$${fmt(p.shares * p.avgCost)}</span></div>
          <div class="meta-item"><span class="meta-label">Mkt Value</span><span class="meta-value" id="val-${p.ticker}">—</span></div>
          <div class="meta-item"><span class="meta-label">Gain / Loss</span><span class="meta-value" id="pnl-${p.ticker}">—</span></div>
          <div class="meta-item"><span class="meta-label">Return</span><span class="meta-value" id="ret-${p.ticker}">—</span></div>
        </div>
      </div>`).join('');
  }

  function buildOptionsCards() {
    document.getElementById('options-grid').innerHTML = OPTIONS.map((o,i) => `
      <div class="opt-card">
        <div class="opt-card-header">
          <div>
            <div class="opt-title">${o.label}</div>
            <div class="opt-subtitle">Expiration ${o.expiry} · ${o.contracts} contract</div>
          </div>
          <span class="badge badge-option">LEAP CALL</span>
        </div>
        <div class="opt-body">
          <div class="opt-left">
            <div class="opt-mkt-label">Market value</div>
            <div class="opt-mkt-value" id="opt-mktval-${i}"><span class="loading-pulse"></span></div>
            <div class="opt-row"><span class="opt-row-label">Current price</span><span class="opt-row-value" id="opt-price-${i}">—</span></div>
            <div class="opt-row"><span class="opt-row-label">Current ${o.underlying} price</span><span class="opt-row-value" id="opt-underlying-${i}">—</span></div>
            <div class="opt-row"><span class="opt-row-label">Today's return</span><span class="opt-row-value" id="opt-today-${i}">—</span></div>
            <div class="opt-row"><span class="opt-row-label">Total return</span><span class="opt-row-value" id="opt-total-${i}">—</span></div>
          </div>
          <div class="opt-right">
            <div class="opt-mkt-label">Details</div>
            <div style="height:36px"></div>
            <div class="opt-row"><span class="opt-row-label">Expiration date</span><span class="opt-row-value">${o.expiry}</span></div>
            <div class="opt-row"><span class="opt-row-label">Average cost</span><span class="opt-row-value">$${fmt(o.avgCost)}</span></div>
            <div class="opt-row"><span class="opt-row-label">${o.underlying} breakeven</span><span class="opt-row-value">$${fmt(o.breakeven)}</span></div>
            <div class="opt-row"><span class="opt-row-label">Contracts</span><span class="opt-row-value">+${o.contracts}</span></div>
          </div>
        </div>
      </div>`).join('');
  }

  function buildWatchCards() {
    document.getElementById('watch-grid').innerHTML = WATCHLIST.map(w => `
      <div class="card">
        <div class="card-header">
          <div class="ticker">${w.ticker}</div>
          <span class="badge ${w.badgeClass}">${w.badge}</span>
        </div>
        <div class="company-name">${w.name}</div>
        <div class="price-row">
          <div class="price" id="price-${w.ticker}"><span class="loading-pulse"></span></div>
          <div class="change flat" id="change-${w.ticker}">—</div>
        </div>
        <div class="meta">
          <div class="meta-item"><span class="meta-label">Open</span><span class="meta-value" id="open-${w.ticker}">—</span></div>
          <div class="meta-item"><span class="meta-label">High</span><span class="meta-value" id="high-${w.ticker}">—</span></div>
          <div class="meta-item"><span class="meta-label">Low</span><span class="meta-value" id="low-${w.ticker}">—</span></div>
        </div>
      </div>`).join('');
  }

  // ── Update functions ──────────────────────────────────────
  function updatePortfolioCard(pos, data) {
    const { c, dp } = data;
    const dir = dp > 0 ? 'up' : dp < 0 ? 'down' : 'flat';
    const sign = dp > 0 ? '+' : '';
    const mktVal  = c * pos.shares;
    const invested = pos.avgCost * pos.shares;
    const pnl = mktVal - invested;
    const ret = (pnl / invested) * 100;

    document.getElementById(`price-${pos.ticker}`).textContent = '$' + fmt(c);
    const chEl = document.getElementById(`change-${pos.ticker}`);
    chEl.textContent = `${sign}${dp.toFixed(2)}%`; chEl.className = `change ${dir}`;

    document.getElementById(`val-${pos.ticker}`).textContent = '$' + fmt(mktVal);
    const pnlEl = document.getElementById(`pnl-${pos.ticker}`);
    pnlEl.textContent = fmtD(pnl); pnlEl.className = `meta-value ${pnl >= 0 ? 'up':'down'}`;
    const retEl = document.getElementById(`ret-${pos.ticker}`);
    retEl.textContent = fmtP(ret); retEl.className = `meta-value ${ret >= 0 ? 'up':'down'}`;
    return { mktVal, invested, pnl };
  }

  function updateOptionCard(opt, idx, underlyingPrice, optData) {
    const totalCost = opt.avgCost * 100 * opt.contracts;
    let mktVal = null, todayReturn = null, totalReturn = null;

    if (optData && optData.last > 0) {
      mktVal      = optData.last * 100 * opt.contracts;
      totalReturn = mktVal - totalCost;
      if (optData.change != null) todayReturn = optData.change * 100 * opt.contracts;
    }

    // Market value
    const mktValEl = document.getElementById(`opt-mktval-${idx}`);
    mktValEl.textContent = mktVal != null ? '$' + fmt(mktVal) : 'N/A';

    // Option current price
    document.getElementById(`opt-price-${idx}`).textContent =
      optData && optData.last > 0 ? '$' + fmt(optData.last) : 'N/A';

    // Underlying price
    document.getElementById(`opt-underlying-${idx}`).textContent =
      underlyingPrice ? '$' + fmt(underlyingPrice) : '—';

    // Today's return
    const todayEl = document.getElementById(`opt-today-${idx}`);
    if (todayReturn != null) {
      const pct = optData.pctChange || 0;
      todayEl.textContent = fmtD(todayReturn) + ` (${fmtP(pct)})`;
      todayEl.className   = `opt-row-value ${todayReturn >= 0 ? 'up':'down'}`;
    } else { todayEl.textContent = 'N/A'; }

    // Total return
    const totalEl = document.getElementById(`opt-total-${idx}`);
    if (totalReturn != null) {
      const pct = ((mktVal - totalCost) / totalCost) * 100;
      totalEl.textContent = fmtD(totalReturn) + ` (${fmtP(pct)})`;
      totalEl.className   = `opt-row-value ${totalReturn >= 0 ? 'up':'down'}`;
    } else { totalEl.textContent = 'N/A'; }

    return { mktVal: mktVal || 0, totalCost, pnl: totalReturn || 0 };
  }

  function updateWatchCard(ticker, data) {
    const { c, dp, h, l, o } = data;
    const dir = dp > 0 ? 'up' : dp < 0 ? 'down' : 'flat';
    document.getElementById(`price-${ticker}`).textContent = '$' + fmt(c);
    const chEl = document.getElementById(`change-${ticker}`);
    chEl.textContent = (dp > 0 ? '+' : '') + dp.toFixed(2) + '%';
    chEl.className = `change ${dir}`;
    if (document.getElementById(`open-${ticker}`))  document.getElementById(`open-${ticker}`).textContent  = '$' + fmt(o);
    if (document.getElementById(`high-${ticker}`))  document.getElementById(`high-${ticker}`).textContent  = '$' + fmt(h);
    if (document.getElementById(`low-${ticker}`))   document.getElementById(`low-${ticker}`).textContent   = '$' + fmt(l);
  }

  // ── News — 1 top article per ticker ──────────────────────
  async function loadNews() {
    const container = document.getElementById('news-list');
    try {
      const results = await Promise.all(
        NEWS_TICKERS.map(async t => {
          const items = await fetchNews(t);
          const top = (items || []).filter(n => n.headline && n.url)[0];
          return top ? { ...top, _ticker: t } : null;
        })
      );
      const articles = results.filter(Boolean).sort((a,b) => b.datetime - a.datetime);
      if (!articles.length) { container.innerHTML = '<div style="color:#6e7681;text-align:center;padding:20px">No recent news found.</div>'; return; }
      container.innerHTML = articles.map(n => `
        <a class="news-item" href="${n.url}" target="_blank" rel="noopener">
          <span class="news-ticker-tag">${n._ticker}</span>
          <div class="news-body">
            <div class="news-headline">${n.headline}</div>
            <div class="news-source">${n.source} · ${new Date(n.datetime*1000).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </a>`).join('');
    } catch(e) {
      container.innerHTML = '<div style="color:#6e7681;text-align:center;padding:20px">Could not load news.</div>';
    }
  }

  // ── Main ──────────────────────────────────────────────────
  async function init() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true; btn.textContent = 'Refreshing...';
    document.getElementById('last-updated').textContent = 'Updating...';

    // All unique underlying tickers we need quotes for
    const quoteTickers = [...new Set([
      ...POSITIONS.map(p => p.ticker),
      ...OPTIONS.map(o => o.underlying),
      ...WATCHLIST.map(w => w.ticker),
    ])];

    // Fetch all quotes in parallel
    const quoteMap = {};
    await Promise.all(quoteTickers.map(async t => {
      try { quoteMap[t] = await fetchQuote(t); } catch(e) {}
    }));

    // Fetch option chain prices in parallel
    const optionData = await Promise.all(
      OPTIONS.map(o => fetchOptionPrice(o.underlying, o.expiryISO, o.strike, 'call'))
    );

    // Update stock positions + tally
    let stockValue = 0, stockInvested = 0;
    POSITIONS.forEach(pos => {
      if (quoteMap[pos.ticker]) {
        const { mktVal, invested } = updatePortfolioCard(pos, quoteMap[pos.ticker]);
        stockValue    += mktVal;
        stockInvested += invested;
      }
    });
    const stockPnl = stockValue - stockInvested;
    document.getElementById('sum-stock-value').textContent = '$' + fmt(stockValue);
    const spEl = document.getElementById('sum-stock-pnl');
    spEl.textContent = fmtD(stockPnl) + ` (${fmtP((stockPnl/stockInvested)*100)})`;
    spEl.className = `summary-value ${stockPnl >= 0 ? 'up':'down'}`;

    // Update options cards + tally
    let optValue = 0, optCost = 0, optPnl = 0;
    OPTIONS.forEach((opt, i) => {
      const underlying = quoteMap[opt.underlying]?.c || null;
      const { mktVal, totalCost, pnl } = updateOptionCard(opt, i, underlying, optionData[i]);
      optValue += mktVal;
      optCost  += totalCost;
      optPnl   += pnl;
    });
    const optValueEl = document.getElementById('sum-opt-value');
    optValueEl.textContent = optValue > 0 ? '$' + fmt(optValue) : '$' + fmt(optCost) + '*';
    const opEl = document.getElementById('sum-opt-pnl');
    if (optValue > 0) {
      opEl.textContent = fmtD(optPnl) + ` (${fmtP((optPnl/optCost)*100)})`;
      opEl.className   = `summary-value ${optPnl >= 0 ? 'up':'down'}`;
    } else {
      opEl.textContent = 'Live price unavailable';
      opEl.className   = 'summary-value';
      opEl.style.fontSize = '0.75rem';
      opEl.style.color = '#6e7681';
    }

    // Update watchlist
    WATCHLIST.forEach(w => {
      if (quoteMap[w.ticker]) updateWatchCard(w.ticker, quoteMap[w.ticker]);
    });

    // Load news
    await loadNews();

    document.getElementById('last-updated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    btn.disabled = false; btn.textContent = 'Refresh All';
  }

  buildPortfolioCards();
  buildOptionsCards();
  buildWatchCards();
  init();
</script>
</body>
</html>
